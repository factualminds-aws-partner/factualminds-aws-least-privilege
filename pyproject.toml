[project]
name = "factualminds-aws-least-privilege"
version = "0.1.0"
description = "FactualMinds AWS Least Privilege Advisor: generate, explain and validate least-privilege IAM policies."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FactualMinds" }]
keywords = ["aws", "iam", "least-privilege", "security", "cli"]
dependencies = [
    "typer>=0.12",
    "boto3>=1.34",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-hcl2>=4.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/factualminds-aws-partner/factualminds-aws-least-privilege"
Documentation = "https://github.com/factualminds-aws-partner/factualminds-aws-least-privilege/tree/main/docs"
Issues = "https://github.com/factualminds-aws-partner/factualminds-aws-least-privilege/issues"

[project.scripts]
fmaws = "fmaws.cli.app:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmaws"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501", "SIM905"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "hcl2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
